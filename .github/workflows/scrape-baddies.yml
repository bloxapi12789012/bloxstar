name: Scrape Bloxtsar Baddies items

on:
  schedule:
    # Every 60 minutes, away from the top-of-hour Actions traffic spike.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      max_item_id:
        description: Highest item ID to scan (inclusive)
        required: false

concurrency:
  group: bloxtsar-baddies-hourly-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      pages: read
    env:
      MIN_ITEM_ID: '1'
      # Empty for scheduled/default runs; src/config.js supplies 2856.
      MAX_ITEM_ID: ${{ inputs.max_item_id }}
      CONCURRENCY: '4'
      OUTPUT_DIR: data

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run tests
        run: npm test

      - name: Scan configured item ID range
        run: npm run scrape

      - name: Build website and JSON API
        run: npm run build:site

      - name: Upload scan results
        uses: actions/upload-artifact@v7
        with:
          name: baddies-items-${{ github.run_id }}
          path: data/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
